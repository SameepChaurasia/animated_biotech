version: "3.8"

services:
  # Next.js 16 Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-bio-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/codex_bio?schema=public
      - MONGODB_URI=mongodb://mongo:27017/codex_bio
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - mongo
      - kafka

  # Express.js & Kafka Background Compute Worker
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: codex-bio-worker
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka

  # PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: codex-bio-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=codex_bio
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB 7.0 Document Database
  mongo:
    image: mongo:7.0
    container_name: codex-bio-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Apache Kafka Message Broker & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: codex-bio-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: codex-bio-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper

volumes:
  postgres_data:
  mongo_data:
