apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-bio-ingress
  namespace: codex-bio
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - codexbio.ai
      secretName: codex-bio-tls
  rules:
    - host: codexbio.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codex-bio-web-service
                port:
                  number: 80
