apiVersion: v1
kind: Service
metadata:
  name: codex-bio-web-service
  namespace: codex-bio
spec:
  type: ClusterIP
  selector:
    app: codex-bio-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: codex-bio-worker-service
  namespace: codex-bio
spec:
  type: ClusterIP
  selector:
    app: codex-bio-worker
  ports:
    - name: http
      port: 4001
      targetPort: 4001
