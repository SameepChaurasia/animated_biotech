apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-bio-web
  namespace: codex-bio
  labels:
    app: codex-bio-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codex-bio-web
  template:
    metadata:
      labels:
        app: codex-bio-web
    spec:
      containers:
        - name: web
          image: ghcr.io/sameepchaurasia/codex-bio-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codex-bio-secrets
                  key: database-url
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: codex-bio-secrets
                  key: mongodb-uri
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /api/analysis
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
